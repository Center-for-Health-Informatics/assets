name: "assets"
services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./htdocs:/usr/share/nginx/html
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      # Private VM network only. A port published on the host's enterprise address is
      # reachable from all of 10.0.0.0/8, which bypasses every control chi-hermes applies.
      # BIND_ADDRESS has no default on purpose: unset must abort, not bind 0.0.0.0.
      - ${BIND_ADDRESS:?set BIND_ADDRESS in .env to this host's private address}:${HTTP_PORT}:80
    environment:
      - TZ=${TZ:-America/New_York}
